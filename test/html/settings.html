<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: Inter, sans-serif; background: #22314a; }
  .panel { position: absolute; top: 60px; left: 50%; margin-left: -300px; width: 600px; height: 600px; background: #0f1117; border-radius: 18px; color: #e5e7eb; padding: 24px; box-sizing: border-box; outline: 1px solid #2a2f3d; }
  h2 { margin: 0 0 4px; font-size: 24px; }
  p.sub { margin: 0 0 18px; color: #9ca3af; font-size: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1f2430; }
  .row span { font-size: 15px; }
  .switch { width: 44px; height: 24px; border-radius: 999px; background: #374151; position: relative; }
  .switch.on { background: #6366f1; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  .switch.on::after { left: 23px; }
  input[type=text] { width: 220px; height: 34px; border-radius: 8px; border: 1px solid #374151; background: #161a23; color: #fff; padding: 0 10px; font-size: 14px; }
  select { height: 34px; border-radius: 8px; border: 1px solid #374151; background: #161a23; color: #fff; padding: 0 10px; font-size: 14px; }
  .list { height: 150px; overflow-y: auto; margin-top: 14px; border-radius: 10px; background: #161a23; padding: 6px 10px; }
  .list div { padding: 8px 4px; border-bottom: 1px solid #222736; font-size: 14px; color: #cbd5e1; }
  .actions { position: absolute; left: 24px; right: 24px; bottom: 24px; display: flex; gap: 10px; justify-content: flex-end; }
  .btn { height: 40px; padding: 0 18px; border-radius: 10px; border: 0; font-weight: 700; font-size: 14px; }
  .btn.ghost { background: transparent; color: #9ca3af; border: 1px solid #374151; }
  .btn.primary { background: #6366f1; color: #fff; }
</style></head>
<body>
  <div class="panel" id="SettingsPanel">
    <h2>Settings</h2>
    <p class="sub">Tune your experience. Changes apply instantly.</p>
    <div class="row"><span>Music</span><div class="switch on" id="MusicToggle"></div></div>
    <div class="row"><span>Shadows</span><div class="switch" id="ShadowsToggle"></div></div>
    <div class="row"><span>Display name</span><input type="text" id="NameInput" placeholder="Enter a nickname"></div>
    <div class="row"><span>Graphics</span><select id="Quality"><option>Medium</option><option selected>High</option></select></div>
    <div class="row"><span>Show FPS</span><input type="checkbox" checked id="FpsCheck"></div>
    <div class="list" id="Friends">
      <div>🟢 BuilderBob</div><div>🟢 NoobMaster</div><div>⚪ PixelPete</div><div>⚪ LavaQueen</div><div>⚪ RobloxRanger</div><div>⚪ CoolCat</div>
    </div>
    <div class="actions"><button class="btn ghost" id="ResetButton">Reset</button><button class="btn primary" id="SaveButton">Save changes</button></div>
  </div>
</body></html>
